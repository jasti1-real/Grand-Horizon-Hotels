<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grand Horizon Hotels — Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">
<div class="max-w-5xl mx-auto p-4 sm:p-8">
  <header class="flex items-center justify-between gap-4 mb-8">
    <div><p class="text-xs uppercase tracking-widest text-yellow-400">Grand Horizon Hotels</p><h1 class="text-2xl sm:text-3xl font-bold">Admin Dashboard</h1></div>
    <button id="logout" class="hidden rounded-xl border border-slate-700 px-4 py-2">Logout</button>
  </header>
  <section id="login" class="max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6">
    <h2 class="text-xl font-bold">Owner Login</h2>
    <p class="text-slate-400 text-sm mt-1 mb-5">Use the administrator credentials configured on the Cloudflare Worker.</p>
    <input id="email" type="text" placeholder="Admin email" class="w-full mb-3 rounded-xl bg-slate-950 border border-slate-700 px-4 py-3">
    <input id="password" type="password" placeholder="Admin password" class="w-full mb-4 rounded-xl bg-slate-950 border border-slate-700 px-4 py-3">
    <button id="loginBtn" class="w-full rounded-xl bg-yellow-400 text-black font-bold py-3">Sign in</button>
    <p id="loginError" class="text-red-400 text-sm mt-3"></p>
  </section>
  <section id="dashboard" class="hidden">
    <div class="flex items-center justify-between mb-5">
      <div><h2 class="text-lg font-bold">Business Overview</h2><p class="text-slate-400 text-sm">Read-only customer and cash-flow totals.</p></div>
      <button id="refresh" class="text-yellow-400 text-sm">Refresh</button>
    </div>
    <div id="stats" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
  </section>
</div>
<script>
const $=id=>document.getElementById(id);
async function api(path,opt={}){const r=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d;}
function money(n){return 'UGX '+Number(n||0).toLocaleString('en-UG');}
function card(title,value,description){return '<div class="bg-slate-900 border border-slate-800 rounded-2xl p-5"><p class="text-slate-400 text-sm">'+title+'</p><p class="text-2xl font-bold mt-2">'+value+'</p><p class="text-slate-500 text-xs mt-2">'+description+'</p></div>';}
async function load(){
  try{
    const d=await api('/api/admin/summary');
    $('login').classList.add('hidden'); $('dashboard').classList.remove('hidden'); $('logout').classList.remove('hidden');
    $('stats').innerHTML =
      card('Customers registered',Number(d.users||0).toLocaleString(),'Total registered customer accounts')+
      card('Deposits',Number(d.depositCount||0).toLocaleString(),'Completed deposit transactions')+
      card('Money coming in',money(d.totalDeposits),'Total completed deposits')+
      card('Withdrawals',Number(d.withdrawalCount||0).toLocaleString(),'Completed withdrawal transactions')+
      card('Money going out',money(d.totalWithdrawals),'Total completed withdrawals');
    $('withdrawalStatus').textContent = d.withdrawalsOpen ? 'Withdrawals are currently allowed.' : 'Withdrawals are currently closed.';
    $('withdrawalToggle').textContent = d.withdrawalsOpen ? 'Close withdrawals' : 'Allow withdrawals';
    $('withdrawalToggle').className = d.withdrawalsOpen
      ? 'rounded-xl px-5 py-3 font-bold bg-red-500 text-white'
      : 'rounded-xl px-5 py-3 font-bold bg-green-500 text-black';
  }catch(e){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');}
}
$('loginBtn').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});$('loginError').textContent='';await load();}catch(e){$('loginError').textContent=e.message}};
$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};
$('refresh').onclick=load;
$('withdrawalToggle').onclick=async()=>{
  const current=$('withdrawalToggle').textContent==='Close withdrawals';
  if(!confirm(current ? 'Close withdrawals for customers?' : 'Allow customers to request withdrawals?')) return;
  try{
    await api('/api/admin/withdrawals/status',{method:'POST',body:JSON.stringify({open:!current})});
    await load();
  }catch(e){alert(e.message)}
};
load();
</script>
</body></html>
