<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grand Horizon Hotels — Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">
<div class="max-w-6xl mx-auto p-4 sm:p-8">
  <header class="flex items-center justify-between gap-4 mb-6">
    <div><p class="text-xs uppercase tracking-widest text-yellow-400">Grand Horizon Hotels</p><h1 class="text-2xl sm:text-3xl font-bold">Admin Dashboard</h1></div>
    <button id="logout" class="hidden rounded-xl border border-slate-700 px-4 py-2">Logout</button>
  </header>
  <section id="login" class="max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6">
    <h2 class="text-xl font-bold">Owner Login</h2>
    <p class="text-slate-400 text-sm mt-1 mb-5">Use the administrator credentials configured on the Cloudflare Worker.</p>
    <input id="email" type="email" placeholder="Admin email" class="w-full mb-3 rounded-xl bg-slate-950 border border-slate-700 px-4 py-3">
    <input id="password" type="password" placeholder="Admin password" class="w-full mb-4 rounded-xl bg-slate-950 border border-slate-700 px-4 py-3">
    <button id="loginBtn" class="w-full rounded-xl bg-yellow-400 text-black font-bold py-3">Sign in</button>
    <p id="loginError" class="text-red-400 text-sm mt-3"></p>
  </section>
  <section id="dashboard" class="hidden">
    <div id="stats" class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-6"></div>
    <div class="grid lg:grid-cols-2 gap-5">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <div class="flex justify-between items-center mb-4"><h2 class="font-bold">Pending Deposits</h2><button id="refresh" class="text-yellow-400 text-sm">Refresh</button></div>
        <div id="deposits" class="space-y-3"></div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <h2 class="font-bold mb-4">Recent Referrals</h2><div id="referrals" class="space-y-3"></div>
      </div>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 mt-5">
      <h2 class="font-bold mb-4">Recent Users</h2><div class="overflow-auto"><table class="w-full text-sm"><thead><tr class="text-slate-400 text-left"><th class="p-2">ID</th><th class="p-2">Login</th><th class="p-2">Balance</th><th class="p-2">Earnings</th><th class="p-2">Created</th></tr></thead><tbody id="users"></tbody></table></div>
    </div>
  </section>
</div>
<script>
const $=id=>document.getElementById(id);
async function api(path,opt={}){const r=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d;}
function money(n){return 'UGX '+Number(n||0).toLocaleString('en-UG');}
async function load(){try{const d=await api('/api/admin/summary');$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');$('stats').innerHTML=[['Users',d.users],['Balances',money(d.totalBalances)],['Pending deposits',d.pendingDeposits],['Investments',d.investments],['Referral bonuses',money(d.referralBonuses)]].map(x=>'<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><p class="text-slate-400 text-xs">'+x[0]+'</p><p class="text-xl font-bold mt-1">'+x[1]+'</p></div>').join('');render(d);}
catch(e){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');}}
function render(d){$('deposits').innerHTML=d.deposits.length?d.deposits.map(x=>'<div class="border border-slate-800 rounded-xl p-3"><div class="flex justify-between gap-3"><div><b>'+x.login+'</b><p class="text-slate-400 text-xs">'+money(x.amount)+' · '+(x.method||'—')+'</p></div><button onclick="approve('+x.id+')" class="bg-green-500 text-black font-bold rounded-lg px-3 py-2 text-xs">Approve</button></div></div>').join(''):'<p class="text-slate-500">No pending deposits.</p>';
$('referrals').innerHTML=d.referrals.length?d.referrals.map(x=>'<div class="border border-slate-800 rounded-xl p-3"><b>'+x.referrer_login+'</b><p class="text-slate-400 text-xs">Referred: '+x.referred_login+' · Bonus: '+money(x.bonus_amount)+' · '+x.status+'</p></div>').join(''):'<p class="text-slate-500">No referrals yet.</p>';
$('users').innerHTML=d.usersList.map(x=>'<tr class="border-t border-slate-800"><td class="p-2">'+x.id+'</td><td class="p-2">'+x.login+'</td><td class="p-2">'+money(x.balance)+'</td><td class="p-2">'+money(x.total_earnings)+'</td><td class="p-2">'+new Date(x.created_at).toLocaleString()+'</td></tr>').join('');
}
async function approve(id){if(!confirm('Approve this deposit? This credits the customer and, when eligible, the 5% referral bonus.'))return;try{await api('/api/admin/deposits/'+id+'/approve',{method:'POST'});await load();}catch(e){alert(e.message)}}
$('loginBtn').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});$('loginError').textContent='';await load();}catch(e){$('loginError').textContent=e.message}};
$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};
$('refresh').onclick=load;
load();
</script>
</body></html>
